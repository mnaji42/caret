[project]
name = "caspr-engine"
version = "0.1.0"
description = "Moteur de transcription local pour Caspr"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "transformers>=4.40",
    "numpy>=1.26",
    "accelerate>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["caspr_engine"]
