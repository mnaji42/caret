<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 150" width="390" height="150" fill="none">
  <!-- =========================================================================
       CASPR - LOGO HORIZONTAL OFFICIEL
       Fantôme à gauche + Mot Caspr + Bulle d'écoute au-dessus du "r"
       ========================================================================= -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&amp;display=swap');
      .caspr-brand-text {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- 1. FANTÔME CASPR OFFICIEL (À gauche) -->
  <g transform="translate(16, 12) scale(0.50)">
    <!-- Corps 4 lobes symétriques -->
    <path
      fill="#FFFFFF"
      d="
        M128 20
        C80 20 48 55 48 104
        V158
        C48 176 40 187 34 199
        C27 212 31 225 43 232
        C55 239 68 234 77 220
        C85 232 96 238 108 238
        C117 238 123 232 128 222
        C133 232 139 238 148 238
        C160 238 171 232 179 220
        C188 234 201 239 213 232
        C225 225 229 212 222 199
        C216 187 208 176 208 158
        V104
        C208 55 176 20 128 20
        Z
      "
    />

    <!-- Yeux capsules 19x32 -->
    <rect x="90" y="98" width="19" height="32" rx="9.5" fill="#0A0F14"/>
    <rect x="147" y="98" width="19" height="32" rx="9.5" fill="#0A0F14"/>

    <!-- Bouche demi-lune officielle Y=150 -->
    <path d="M 110 150 C 110 166 146 166 146 150 C 146 150 110 150 110 150 Z" fill="#0A0F14"/>
  </g>

  <!-- 2. MOT CASPR (Aligné verticalement à droite du fantôme) -->
  <text
    x="145"
    y="118"
    class="caspr-brand-text"
    font-size="68"
    fill="#FFFFFF"
    letter-spacing="0.025em"
  >Caspr</text>

  <!-- 3. BULLE D'ÉCOUTE OFFICIELLE (Positionnée au-dessus du "r") -->
  <g transform="translate(295, 30) scale(0.53)">
    <!-- Coque de la bulle avec contour blanc fin -->
    <path
      d="M 30 8 H 98 C 110 8 120 18 120 30 V 52 C 120 64 110 74 98 74 H 74 L 64 89 L 54 74 H 30 C 18 74 8 64 8 52 V 30 C 8 18 18 8 30 8 Z"
      fill="#0A0F14"
      stroke="#FFFFFF"
      stroke-width="3.5"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <!-- 5 Barres Cyan Électrique #00F0FF parfaitement centrées -->
    <rect x="30.5" y="37" width="7" height="8" rx="3.5" fill="#00F0FF"/>
    <rect x="45.5" y="30" width="7" height="22" rx="3.5" fill="#00F0FF"/>
    <rect x="60.5" y="24" width="7" height="34" rx="3.5" fill="#00F0FF"/>
    <rect x="75.5" y="30" width="7" height="22" rx="3.5" fill="#00F0FF"/>
    <rect x="90.5" y="37" width="7" height="8" rx="3.5" fill="#00F0FF"/>
  </g>
</svg>
